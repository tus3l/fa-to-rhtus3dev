<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="TUS3dev لإدارة مستندات المشاريع والفواتير والإقرارات الإلكترونية.">
  <title>TUS3dev | مساحة العمل</title>
  <link rel="stylesheet" href="vendor/fonts/arabic/400.css">
  <link rel="stylesheet" href="vendor/fonts/arabic/500.css">
  <link rel="stylesheet" href="vendor/fonts/arabic/600.css">
  <link rel="stylesheet" href="vendor/fonts/arabic/700.css">
  <link rel="stylesheet" href="vendor/fonts/latin/400.css">
  <link rel="stylesheet" href="vendor/fonts/latin/500.css">
  <link rel="stylesheet" href="vendor/fonts/latin/600.css">
  <link rel="stylesheet" href="vendor/fonts/latin/700.css">
  <link rel="stylesheet" href="vendor/fonts/latin/800.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/lucide/lucide.js"></script>
  <script defer src="vendor/signature/signature_pad.umd.min.js"></script>
  <script defer src="vendor/export/html-to-image.js"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="#dashboard" aria-label="TUS3dev الرئيسية"><span class="brand-symbol"><i data-lucide="command"></i></span><span class="brand-word" dir="ltr">TUS3<span>dev</span><span class="brand-dot">.</span></span></a>
      <div class="workspace-label"><span class="workspace-avatar">T</span><div><strong>مساحة العمل</strong><small>حساب مقدم الخدمة</small></div><i data-lucide="chevrons-up-down"></i></div>
      <div class="nav-label">الرئيسية</div>
      <nav>
        <a href="#dashboard" data-nav="dashboard"><i data-lucide="layout-dashboard"></i><span>نظرة عامة</span></a>
        <a href="#documents" data-nav="documents"><i data-lucide="files"></i><span>المستندات</span><span class="nav-count" id="nav-count">0</span></a>
        <a href="#clients" data-nav="clients"><i data-lucide="users-round"></i><span>العملاء</span></a>
        <a href="#activity" data-nav="activity"><i data-lucide="activity"></i><span>سجل النشاط</span><span class="small-dot"></span></a>
      </nav>
      <div class="nav-label second-label">إدارة المساحة</div>
      <nav><a href="#archive" data-nav="archive"><i data-lucide="archive"></i><span>الأرشيف</span></a><a href="#settings" data-nav="settings"><i data-lucide="settings-2"></i><span>الإعدادات</span></a></nav>
      <div class="sidebar-bottom"><div class="connection"><span></span>مساحة خاصة وآمنة<i data-lucide="shield-check"></i></div><button class="account-button" id="account-button"><span class="avatar" id="avatar">T</span><span><strong id="account-name">حسابك الشخصي</strong><small id="account-caption">تسجيل الدخول</small></span><i data-lucide="log-in"></i></button></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb"><span>TUS3dev</span><i data-lucide="chevron-left"></i><strong id="breadcrumb-current">نظرة عامة</strong></div><div class="header-actions"><span class="today" id="today"></span><span class="header-divider"></span><button class="icon-button" id="theme-button" title="تغيير المظهر" aria-label="تغيير المظهر"><i data-lucide="moon"></i></button><button class="icon-button notification-button" id="notification-button" title="الإشعارات" aria-label="الإشعارات"><i data-lucide="bell"></i><span id="notification-dot" hidden></span></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer"><span dir="ltr">© <span id="year"></span> TUS3dev</span><span>كل اتفاق يستحق أن يُوثَّق.<span class="footer-dot"></span></span></footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <noscript><p>يرجى تفعيل JavaScript لاستخدام المنصة.</p></noscript>
</body>
</html>
